# Virtual workspace: no package lives at the root, every crate is under crates/.
#   soulband-core - game logic library (no windowing, input, or rendering)
#   soulband-gui  - macroquad frontend; builds the `soulband` and `tile_selector` binaries
[workspace]
resolver = "2"
members = ["crates/*"]

# Shared by every crate via `version.workspace = true` / `edition.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"

# Shared dependency versions, so all crates use the same rand.
[workspace.dependencies]
rand = "0.10.2"
