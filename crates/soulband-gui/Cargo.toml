[package]
name = "soulband-gui"
version.workspace = true
edition.workspace = true
default-run = "soulband"

# The crate is soulband-gui, but the game binary is still called `soulband`.
[[bin]]
name = "soulband"
path = "src/main.rs"

[[bin]]
name = "tile_selector"
path = "src/tile_selector.rs"

[dependencies]
soulband-core = { path = "../soulband-core" }
macroquad = "0.4"

# egui-macroquad audio is disabled because WSL2 lacks native audio support, causing ALSA errors at
# runtime. default-features = false only disables audio feature (see egui-macroquad Cargo.toml)
egui-macroquad = { version = "0.17", default-features = false }
rand = { workspace = true }
